function b64decode(s) {
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function decrypt() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.style.display = 'none';

  try {
    const salt = b64decode(ENCRYPTED.salt);
    const iv = b64decode(ENCRYPTED.iv);
    const ct = b64decode(ENCRYPTED.ct);

    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
    );

    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      key,
      ct
    );

    const html = new TextDecoder().decode(decrypted);

    // Replace entire page with decrypted content
    document.getElementById('loginBox').style.display = 'none';
    const content = document.getElementById('content');
    content.style.display = 'block';
    content.innerHTML = html;

    // Execute any scripts in decrypted content
    content.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });

    // Apply styles from decrypted content
    const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/);
    if (styleMatch) {
      const style = document.createElement('style');
      style.textContent = styleMatch[1];
      document.head.appendChild(style);
    }

  } catch (e) {
    err.style.display = 'block';
    document.getElementById('pwd').select();
  }
}

// Enter key support
document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') decrypt();
});
