function b64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decrypt() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const salt = b64d(E.salt), iv = b64d(E.iv), ct = b64d(E.ct);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, km,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(dec);
    document.getElementById('loginBox').style.display = 'none';
    document.body.style.display = 'block';
    const content = document.getElementById('content');
    content.style.display = 'block';
    content.innerHTML = html;
    const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/);
    if (styleMatch) { const s = document.createElement('style'); s.textContent = styleMatch[1]; document.head.appendChild(s); }
    content.querySelectorAll('script').forEach(old => { const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s); });
  } catch (e) {
    err.style.display = 'block';
    document.getElementById('pwd').select();
  }
}

document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') decrypt(); });
